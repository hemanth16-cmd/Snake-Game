<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#17191b"><title>Snake</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main><header><h1>Snake</h1><div class="scores"><span>Score <b id="score">0</b></span><span>Best <b id="best">0</b></span></div></header>
<div class="board"><canvas id="game" width="600" height="600" aria-label="Snake game board. Use arrow keys to move." tabindex="0"></canvas><div class="overlay" id="overlay"><h2 id="title">Snake</h2><p id="message">Eat the food. Edges wrap around. Avoid your tail.</p><button class="start" id="start">Play</button></div></div>
<div class="bar"><p>Arrow keys · Space to pause · Edges wrap</p><div><button id="pause" disabled>Pause</button><button id="restart">Restart</button></div></div>
<div class="controls" aria-label="Direction controls"><button class="up" data-dir="up" aria-label="Move up">↑</button><button class="left" data-dir="left" aria-label="Move left">←</button><button data-dir="down" aria-label="Move down">↓</button><button data-dir="right" aria-label="Move right">→</button></div>
<p class="note" id="status" aria-live="polite">Press Play or an arrow key to start.</p>
</main>
<script src="script.js"></script>
</body></html>
